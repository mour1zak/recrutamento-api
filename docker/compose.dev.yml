name: recrutamento-api
services:
  postgres:
    image: postgres:18-alpine
    container_name: recrutamento-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - recrutamento-net

  migrate:
    build:
      context: ..
      target: build
    container_name: recrutamento-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recrutamento-net

  api:
    build:
      context: ..
      target: runtime
    container_name: recrutamento-api
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      API_KEY: ${API_KEY}
      EXTERNAL_CEP_API_URL: ${EXTERNAL_CEP_API_URL:-https://viacep.com.br/ws}
      EXTERNAL_CEP_TIMEOUT_MS: ${EXTERNAL_CEP_TIMEOUT_MS:-3000}
      UPLOAD_DIR: uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - recrutamento-net

volumes:
  postgres_data:
  uploads:

networks:
  recrutamento-net:
    driver: bridge