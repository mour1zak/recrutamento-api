server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
    pipeline_stages:
      - docker: {}
      # Remove códigos de cor ANSI (\x1b[32m, \x1b[39m, etc.) que o logger
      # padrão do Nest imprime mesmo sem terminal interativo — sem isso, o
      # texto armazenado no Loki fica com esse "lixo" no meio, quebrando
      # qualquer extração de campo (pattern/regexp) nas consultas do Grafana.
      - replace:
          expression: '\x1b\[[0-9;]*m'
          replace: ''